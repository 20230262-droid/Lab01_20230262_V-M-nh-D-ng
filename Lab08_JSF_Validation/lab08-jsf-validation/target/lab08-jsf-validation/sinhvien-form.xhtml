<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"><h:head><title>Form sinh viên</title><h:outputStylesheet library="css" name="style.css"/></h:head><h:body><div class="app"><ui:include src="/templates/menu.xhtml"/><div class="main"><ui:include src="/templates/header.xhtml"/><main class="content"><div class="card"><h1>#{sinhVienBean.sinhVien.id == 0 ? 'Thêm sinh viên' : 'Cập nhật sinh viên'}</h1><p>Validation từng trường • Bài 4, 9, 12</p><h:form><div class="grid"><div class="field"><label>Mã sinh viên</label><h:inputText id="ma" value="#{sinhVienBean.sinhVien.maSinhVien}" required="true" requiredMessage="Mã sinh viên không được để trống"/><h:message for="ma" styleClass="error"/></div><div class="field"><label>Họ tên</label><h:inputText id="ten" value="#{sinhVienBean.sinhVien.hoTen}" required="true" requiredMessage="Họ tên không được để trống"><f:validateLength minimum="5"/></h:inputText><h:message for="ten" styleClass="error"/></div><div class="field"><label>Email</label><h:inputText id="email" value="#{sinhVienBean.sinhVien.email}" required="true" requiredMessage="Email không được để trống"><f:validateRegex pattern="^[A-Za-z0-9+_.-]+@[A-Za-z0-9.-]+$"/></h:inputText><h:message for="email" styleClass="error"/></div><div class="field"><label>Lớp</label><h:selectOneMenu id="lop" value="#{sinhVienBean.sinhVien.lop}" required="true" requiredMessage="Vui lòng chọn lớp"><f:selectItem itemLabel="-- Chọn lớp --" itemValue=""/><f:selectItem itemLabel="DCCNTT15.10.1" itemValue="DCCNTT15.10.1"/><f:selectItem itemLabel="DCCNTT15.10.2" itemValue="DCCNTT15.10.2"/><f:selectItem itemLabel="DCCNTT15.10.3" itemValue="DCCNTT15.10.3"/></h:selectOneMenu><h:message for="lop" styleClass="error"/></div></div><h:commandButton styleClass="btn" value="Lưu dữ liệu" action="#{sinhVienBean.save}"/> <h:link styleClass="btn ghost" outcome="sinhvien-list" value="Quay lại"/></h:form></div><ui:include src="/templates/footer.xhtml"/></main></div></div></h:body></html>

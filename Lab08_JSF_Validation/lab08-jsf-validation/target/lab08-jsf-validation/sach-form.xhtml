<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"><h:head><title>Form Sách</title><h:outputStylesheet library="css" name="style.css"/></h:head><h:body><div class="app"><ui:include src="/templates/menu.xhtml"/><div class="main"><ui:include src="/templates/header.xhtml"/><main class="content"><div class="card"><h1>📚 Form Sách</h1><p>Bài 6: tên và tác giả không rỗng, năm xuất bản hợp lệ.</p><h:messages globalOnly="true" styleClass="msg"/><h:form><div class="grid"><div class="field"><label>Tên sách</label><h:inputText id="ten" value="#{sachBean.item.tenSach}" required="true" requiredMessage="Tên sách không được để trống"/><h:message for="ten" styleClass="error"/></div><div class="field"><label>Tác giả</label><h:inputText id="tg" value="#{sachBean.item.tacGia}" required="true" requiredMessage="Tác giả không được để trống"/><h:message for="tg" styleClass="error"/></div><div class="field"><label>Năm xuất bản</label><h:inputText id="nam" value="#{sachBean.item.namXuatBan}" required="true" requiredMessage="Vui lòng nhập năm"><f:validateLongRange minimum="1900" maximum="2026"/></h:inputText><h:message for="nam" styleClass="error"/></div></div><h:commandButton styleClass="btn" value="Lưu sách" action="#{sachBean.save}"/></h:form></div><ui:include src="/templates/footer.xhtml"/></main></div></div></h:body></html>

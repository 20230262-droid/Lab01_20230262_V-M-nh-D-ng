<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"><h:head><title>Đăng nhập</title><h:outputStylesheet library="css" name="style.css"/></h:head><h:body><div class="login"><div class="card"><h1>🌸 Đăng nhập hệ thống</h1><p>Lab 8 • Jakarta Faces / JSF</p><h:messages globalOnly="true" styleClass="error msg"/><h:form><div class="field"><label>Tài khoản</label><h:inputText value="#{loginBean.username}" required="true" requiredMessage="Vui lòng nhập tài khoản"/></div><div class="field"><label>Mật khẩu</label><h:inputSecret value="#{loginBean.password}" required="true" requiredMessage="Vui lòng nhập mật khẩu"/></div><h:commandButton styleClass="btn" value="Đăng nhập" action="#{loginBean.login}"/><p class="small" style="color:#666;margin-top:15px">Demo: admin / 123456</p></h:form></div></div></h:body></html>

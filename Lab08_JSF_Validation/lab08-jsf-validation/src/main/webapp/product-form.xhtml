<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"><h:head><title>Form Sản phẩm</title><h:outputStylesheet library="css" name="style.css"/></h:head><h:body><div class="app"><ui:include src="/templates/menu.xhtml"/><div class="main"><ui:include src="/templates/header.xhtml"/><main class="content"><div class="card"><h1>🛍️ Form Sản phẩm</h1><p>Bài 7: validate tên, giá và số lượng; hiển thị message lỗi/thành công.</p><h:messages globalOnly="true" styleClass="msg"/><h:form><div class="grid"><div class="field"><label>Tên sản phẩm</label><h:inputText id="ten" value="#{productBean.item.tenSanPham}" required="true" requiredMessage="Tên sản phẩm không được để trống"/><h:message for="ten" styleClass="error"/></div><div class="field"><label>Giá</label><h:inputText id="gia" value="#{productBean.item.gia}" required="true" requiredMessage="Vui lòng nhập giá"><f:validateDoubleRange minimum="0.01"/></h:inputText><h:message for="gia" styleClass="error"/></div><div class="field"><label>Số lượng</label><h:inputText id="sl" value="#{productBean.item.soLuong}" required="true" requiredMessage="Vui lòng nhập số lượng"><f:validateLongRange minimum="0"/></h:inputText><h:message for="sl" styleClass="error"/></div></div><h:commandButton styleClass="btn" value="Lưu sản phẩm" action="#{productBean.save}"/></h:form></div><ui:include src="/templates/footer.xhtml"/></main></div></div></h:body></html>

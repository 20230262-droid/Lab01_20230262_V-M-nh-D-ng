<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"><h:head><title>Danh sách sinh viên</title><h:outputStylesheet library="css" name="style.css"/></h:head><h:body><div class="app"><ui:include src="/templates/menu.xhtml"/><div class="main"><ui:include src="/templates/header.xhtml"/><main class="content"><div class="card"><div class="toolbar"><div><h1>Danh sách sinh viên</h1><p>Tìm kiếm • Sửa • Xóa</p></div><h:link styleClass="btn" outcome="sinhvien-form" value="+ Thêm sinh viên"/></div><h:messages globalOnly="true" styleClass="msg"/><h:form><div class="toolbar"><div class="field" style="min-width:320px"><label>Từ khóa</label><h:inputText value="#{sinhVienBean.keyword}" placeholder="Nhập họ tên hoặc lớp"/></div><h:commandButton styleClass="btn ghost" value="Tìm kiếm"/></div><h:dataTable styleClass="table" value="#{sinhVienBean.danhSach}" var="sv"><h:column><f:facet name="header">Mã SV</f:facet>#{sv.maSinhVien}</h:column><h:column><f:facet name="header">Họ tên</f:facet>#{sv.hoTen}</h:column><h:column><f:facet name="header">Email</f:facet>#{sv.email}</h:column><h:column><f:facet name="header">Lớp</f:facet>#{sv.lop}</h:column><h:column><f:facet name="header">Thao tác</f:facet><h:commandButton styleClass="btn ghost" value="Sửa" action="#{sinhVienBean.edit(sv.id)}"/> <h:commandButton styleClass="btn danger" value="Xóa" action="#{sinhVienBean.delete(sv.id)}"/></h:column></h:dataTable></h:form></div><ui:include src="/templates/footer.xhtml"/></main></div></div></h:body></html>
